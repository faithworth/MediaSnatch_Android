name: Build MediaSnatch APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test/ directory found — skipping."
          fi

      - name: Regenerate Gradle wrapper
        run: |
          mkdir -p /tmp/gradle-wrapper-gen
          cd /tmp/gradle-wrapper-gen
          touch settings.gradle
          gradle wrapper --gradle-version 8.14
          cp -r gradlew gradlew.bat gradle "$GITHUB_WORKSPACE/android/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediasnatch-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
