// AGP and Kotlin versions are now declared declaratively in settings.gradle's
// `plugins {}` block (required by current Flutter Gradle plugin loading).
// kotlin_version is kept here only so android/app/build.gradle's
// `$kotlin_version` dependency reference still resolves — keep it in sync
// with the version pinned in settings.gradle.
ext.kotlin_version = '2.0.21'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects { project.buildDir = "${rootProject.buildDir}/${project.name}" }
subprojects { project.evaluationDependsOn(':app') }

tasks.register("clean", Delete) { delete rootProject.buildDir }
